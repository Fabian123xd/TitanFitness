# Perfil 'isolated': Base de datos aislada en memoria con modo PostgreSQL y ddl-auto=validate.
# NUNCA se conecta ni modifica la base principal de Neon Cloud.
spring.datasource.url=jdbc:h2:mem:fitcore_isolated;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/isolated/schema-isolated.sql'
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

fitcore.admin.username=${ADMIN_USERNAME:admin}
fitcore.admin.password=${ADMIN_PASSWORD:AdminTitan2026}
fitcore.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
