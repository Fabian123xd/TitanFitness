spring.application.name=FitCore

# PostgreSQL - Neon (credenciales SOLO por variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema NO se modifica automaticamente: se valida contra el modelo.
# Las migraciones se gestionan con db/migration/V1 y V2.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Feriados (ISO, separados por coma) que no cuentan como dias habiles. Ej: 2026-12-25,2027-01-01
fitcore.feriados=${FITCORE_FERIADOS:}

# Origenes permitidos por CORS (patrones separados por coma)
fitcore.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Administrador inicial (solo se crea si la tabla usuarios esta vacia)
fitcore.admin.username=${ADMIN_USERNAME:admin}
fitcore.admin.password=${ADMIN_PASSWORD:}
