# Configuracion SOLO para pruebas: base H2 en memoria. Nunca se conecta a Neon.
spring.datasource.url=jdbc:h2:mem:fitcoretest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

fitcore.feriados=
fitcore.cors.allowed-origin-patterns=http://localhost:*
fitcore.admin.username=admin
fitcore.admin.password=ClaveSoloParaPruebas2026
