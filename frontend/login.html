<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan Fitness Club | Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; background: #131a2a; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; }
    .login-logo { color: #3b82f6; font-size: 2.5rem; }
  </style>
</head>
<body>
  <main class="card login-card shadow p-4 border-0">
    <div class="text-center mb-4">
      <i class="fa-solid fa-dumbbell login-logo"></i>
      <h1 class="h4 mt-2 mb-0">Titan Fitness Club</h1>
      <p class="text-muted small">Inicia sesión para continuar</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="usuario" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="clave" autocomplete="current-password" required>
      </div>
      <div id="mensajeError" class="alert alert-danger py-2 small d-none" role="alert">
        Usuario o contraseña incorrectos.
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </main>

  <script>
    // Usuario de prueba (temporal, luego se reemplazará por la validación real del backend)
    const USUARIO_PRUEBA = 'admin';
    const CLAVE_PRUEBA = 'admin';

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const clave = document.getElementById('clave').value;
      const error = document.getElementById('mensajeError');

      if (usuario === USUARIO_PRUEBA && clave === CLAVE_PRUEBA) {
        sessionStorage.setItem('sesionActiva', 'true');
        sessionStorage.setItem('usuario', usuario);
        window.location.href = 'index.html';
      } else {
        error.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
